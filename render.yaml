# Render Blueprint for the DECEPTION registration app.
#
# One web service serves both the API and the built React site, so there is no
# second host, no CORS and no proxy to configure.
#
# Secrets are marked `sync: false`: Render prompts for them once in the dashboard
# and never stores them in this repo.

services:
  - type: web
    name: deception-registration
    runtime: node
    plan: free
    region: singapore          # closest free region to Mumbai
    branch: deploy/production
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      # ---- runtime ----
      - key: NODE_ENV
        value: production

      # ---- database (required) ----
      # Without this the app still boots but loses every registration on restart.
      - key: MONGO_URI
        sync: false

      # ---- organiser login (required) ----
      # This account approves payments and can export every participant's
      # personal details. Do not reuse the value from .env.example.
      - key: ADMIN_PASSWORD
        sync: false

      - key: JWT_SECRET
        generateValue: true     # Render generates a strong random value

      # ---- payments ----
      # MOCK_PAYMENT must stay "false" in production. Set to "true" and anyone
      # can issue themselves a confirmed ticket without paying.
      - key: MOCK_PAYMENT
        value: "false"
      - key: UPI_VPA
        sync: false
      - key: UPI_PAYEE_NAME
        value: ADG DECEPTION

      # ---- fees ----
      # Charged per participant: a 5-player squad owes 5x this, a 6-player squad 6x.
      # Changing this here updates the expected total, the approval threshold, and
      # the fee shown on the home page, the rules and the FAQ.
      - key: PER_HEAD_AMOUNT
        value: "50"
      - key: CURRENCY
        value: INR

      # ---- demo data ----
      # Leave "false". The samples pollute the dashboard, the exports and revenue.
      # One person in more than one squad. See .env.example for the trade-off.
      - key: ALLOW_MULTIPLE_TEAMS
        value: "true"

      - key: SEED_DEMO_DATA
        value: "false"

      # ---- ID card storage (optional) ----
      # Deploy scripts/drive-upload.gs under the ADG Google account and paste its
      # /exec URL here. Without these, ID cards are kept in the database instead.
      - key: DRIVE_UPLOAD_URL
        sync: false
      - key: DRIVE_UPLOAD_TOKEN
        sync: false

      # ---- email (optional) ----
      # Without these the app records every message but sends nothing, which is
      # safe: students can still look their ticket up on the Check Status page.
      # Deploy scripts/email-sender.gs under sfit.aidg@gmail.com and paste its /exec
      # URL and MAIL_TOKEN here. This is the route that works on the free plan; the
      # SMTP keys below are only a fallback (Render free blocks outbound SMTP).
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_TOKEN
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
